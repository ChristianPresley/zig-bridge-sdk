name: CI

on:
  push:
    # rewrite/** branches carry a candidate main head so its checks run before main moves.
    branches: [main, "rewrite/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-lint:
    name: fmt-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - run: zig build fmt
      - run: zig build lint-docs -- --strict --string-literals
      - run: zig build gen-dictionary -- --check --out docs/generated/dictionary.md

  commit-policy:
    name: commit-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # On a pull request, check its head commits, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-zig
      - name: Check every commit of a pull request, or every reachable commit of a push
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            zig build commit-policy -- "origin/${{ github.base_ref }}..HEAD"
          else
            zig build commit-policy -- HEAD
          fi

  test:
    name: test (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    # A test that waits without end stops the job after 30 min, not after the 6 h default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
        # The names of the jobs are required status checks of the ruleset of main, thus the labels
        # stay Debug and ReleaseSafe. `mode` is the optimize mode of Zig 0.17.0.
        optimize: [Debug, ReleaseSafe]
        include:
          - optimize: Debug
            mode: debug
          - optimize: ReleaseSafe
            mode: safe
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig-global-cache
          key: zig-global-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
      # Without --test-timeout, the build waits only 60 s for each answer of a test runner. On
      # Windows with Zig 0.16.0, a race in parallel process starts (an inherited pipe) delayed that
      # answer, and the build reported "test runner failed to respond", although no test hung.
      # The release notes of Zig 0.17.0 do not name a correction, thus the option stays. With the
      # option, each test has a limit of 10 min, and the build waits as long for each answer.
      - run: zig build test -Doptimize=${{ matrix.mode }} --test-timeout 10m --summary all
      # The install step builds mcp-bridge-vscode.
      - run: zig build -Doptimize=${{ matrix.mode }}
      - run: zig build fixture-server -Doptimize=${{ matrix.mode }}
      - name: Run the installed executable
        shell: bash
        run: zig-out/bin/mcp-bridge-vscode --version

  cross:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [aarch64-linux-musl, x86_64-linux-musl, x86_64-windows-gnu, aarch64-macos]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - run: zig build -Dtarget=${{ matrix.target }}
      # vscode.serveStdio is a part of the API of the package. Of the executables, only the
      # embedded server of the tests calls it, thus the job compiles that server for each target.
      - run: zig build embedded-server -Dtarget=${{ matrix.target }}

  # The legacy TypeScript SDK (MCP revision 2025-11-25) starts the bridge over stdio, like VS Code.
  # It lists and calls the tools, and it answers the input requests of the fixture tools as VS Code
  # does: forms, URLs, sampling and roots. Its notification handlers get the list changes, the
  # resource updates and the log messages, and it checks that each comes before the result of the
  # call that caused it. The lockfile pins the npm tree, and npm ci runs no install scripts.
  #
  # The same script then starts bridge-embedded-server (M5), with no bridge executable between
  # the client and the server. That server calls vscode.serveStdio. Thus the initialize of the
  # client selects the legacy path, and the bridge in the process of the server answers it.
  #
  # The second script checks the URL form against bridge-fixture-server over HTTPS with the test
  # CA. The bridge runs as in the process tests: --no-browser, --token-store memory and
  # --ca-file. The script reads the sign-in URL from stderr of the bridge and opens it with the
  # redirects, as a browser does (the same pattern as the authorization scenarios of zig-sdk). It
  # also checks a static authorization header from the environment.
  #
  # The job runs on Linux and on Windows. VS Code starts the bridge on Windows too, where the
  # executables have the extension .exe and the bridge starts its upstream command with PATHEXT.
  # The steps run in bash on each system, so that one command line serves both.
  interop:
    name: interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/interop
      - run: zig build -Doptimize=safe
      - run: zig build fixture-server -Doptimize=safe
      - run: zig build embedded-server -Doptimize=safe
      # With 150 more tools, tools/list has two pages (the page size of zig-sdk is 100).
      - name: Connect the TypeScript SDK client to the bridge
        run: >-
          node .github/interop/legacy_stdio_client.mjs zig-out/bin/mcp-bridge-vscode --
          zig-out/bin/bridge-fixture-server --many-tools 150
      - name: Connect the TypeScript SDK client to a server with the bridge in its process
        run: >-
          node .github/interop/legacy_stdio_client.mjs zig-out/bin/bridge-embedded-server
          --many-tools 150
      # The sign-in at the start, the step-up through a URL elicitation, and the static header.
      - name: Sign in through the bridge with the TypeScript SDK client
        run: >-
          node .github/interop/oauth_stdio_client.mjs zig-out/bin/mcp-bridge-vscode
          zig-out/bin/bridge-fixture-server test/fixtures/tls/ca.crt

  # The consumer of the package (M5): a zig-sdk server that calls vscode.serveStdio. It gets the
  # package from a tarball of the commit, with zig fetch, as an outside user does. The driver then
  # starts the consumer over pipes two times: as VS Code (initialize, a tool call and a form) and
  # as a client of revision 2026-07-28 (server/discover, tools/list and a tool call). The consumer
  # must exit with code 0 at the end of each stdin.
  #
  # The job runs on Linux and on Windows, in bash on each system. The ruleset of main requires
  # a check with the name `consumer`, thus the job `consumer` below collects the two results.
  consumer-system:
    name: consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      # An outside user fetches an archive, which holds only the paths of build.zig.zon. A path
      # dependency would skip that filter, so the job fetches an archive of the commit too.
      - name: Archive the commit
        run: git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/bridge.tar.gz"
      - name: Add the archive as the bridge_sdk dependency
        run: zig fetch --save=bridge_sdk "$RUNNER_TEMP/bridge.tar.gz"
        working-directory: examples/consumer
      - run: zig build
        working-directory: examples/consumer
      - run: ./zig-out/bin/consumer --check
        working-directory: examples/consumer
      - name: Drive one legacy and one modern connection through the consumer
        run: zig build drive
        working-directory: examples/consumer

  # The required check `consumer` of the ruleset: it passes only when the consumer check of each
  # system passed. A skipped or cancelled system fails it too.
  consumer:
    name: consumer
    needs: consumer-system
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check the result of the consumer job of each system
        run: test "${{ needs.consumer-system.result }}" = "success"
