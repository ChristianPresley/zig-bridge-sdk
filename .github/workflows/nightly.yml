name: Nightly

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki-lint:
    name: wiki-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - uses: ./.github/actions/setup-zig
      - run: zig build lint-docs -- --strict --wiki-dir wiki

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      # -Dfuzz: the fuzz path of the test runner of Zig 0.16.0 does not compile. See build.zig.
      # The fuzz targets are in src/bridge/fuzz_test.zig.
      - run: zig build test -Dfuzz --fuzz=200000 --summary all
      # After a crash of a fuzz target, Zig 0.16.0 keeps the input in .zig-cache/f/crash, but
      # the build still ends with exit code 0. Thus this step fails the job and shows the input.
      - name: Fail when a fuzz target crashed
        run: |
          if [ -e .zig-cache/f/crash ]; then
            echo "::error::A fuzz target crashed. The input follows."
            od -A d -c .zig-cache/f/crash | head -n 200
            exit 1
          fi
